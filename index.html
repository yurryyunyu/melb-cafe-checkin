<script>(function(){
  // v40: empty storage and the old silent 田园 default become 古风.
  // An explicit picker stamp (mcc.themePick) is kept, as are ranch / foundation / sketch / a saved jrpg.
  var OK={foundation:1,ranch:1,valley:1,jrpg:1,sketch:1};
  function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  var t=get("mcc.theme"), pick=get("mcc.themePick"), mig=null; try{mig=localStorage.getItem("mcc.themeMig")}catch(e){}
  if(mig!=="v40"){try{localStorage.setItem("mcc.themeMig","v40")}catch(e){}
    if(pick&&OK[pick])t=pick;
    else if(t==="ranch"||t==="foundation"||t==="sketch"||t==="jrpg"){}
    else{t="jrpg";try{localStorage.setItem("mcc.theme",JSON.stringify("jrpg"))}catch(e){}}}
  if(!t||!OK[t])t="jrpg";
  var h=document.documentElement, pixel=t==="jrpg"||t==="valley"||t==="ranch";
  h.setAttribute("data-theme",t==="sketch"?"sketch":pixel?"jrpg":"foundation");
  if(t==="valley"||t==="ranch")h.setAttribute("data-skin","valley");
  if(t==="ranch")h.setAttribute("data-ranch","1");
  if(t==="jrpg")h.setAttribute("data-xuan","1");
  window.__mccTheme=t;
})();</script>

<script>window.__sketchFonts=function(){if(window.__sfOn)return;window.__sfOn=1;["https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Josefin+Sans:wght@600;700&display=swap","https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css"].forEach(function(u){var l=document.createElement("link");l.rel="stylesheet";l.href=u;l.media="print";l.onload=function(){this.media="all"};document.head.appendChild(l)})};if(window.__mccTheme==="sketch")window.__sketchFonts();</script>
<style>
  html,body{background:#f7f4ec}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:16px/1.5 -apple-system,"PingFang SC",sans-serif;color:#4a4a4a;background:#f7f4ec;z-index:9999;text-align:center;padding:24px}
  #boot .cup{font-size:44px;animation:bootb 1s ease-in-out infinite alternate}
  #boot .err{display:none;max-width:320px;font-size:14px;color:#c94a6b}
  #boot.failed .err{display:block}
  #boot button{margin-top:6px;border:2px solid #4a4a4a;border-radius:14px;background:#fbd6df;padding:8px 18px;font-size:15px}
  /* Bare jrpg only. 古风 sets data-xuan in the boot script, so this blue rule must not match the default. */
  html[data-theme=jrpg]:not([data-skin]):not([data-xuan]),html[data-theme=jrpg]:not([data-skin]):not([data-xuan]) body,html[data-theme=jrpg]:not([data-skin]):not([data-xuan]) #boot{background:#0b0f2a;color:#fff}
  html[data-theme=jrpg]:not([data-skin]):not([data-xuan]) #boot button{background:#29366f;color:#fff;border-color:#fff;border-radius:4px}
  /* Beat jrpg.css (same specificity, loaded later) so 田园 cannot flash or stick as the blue shell if valley.css is late. */
  html[data-theme][data-skin=valley]:not([data-ranch]),html[data-theme][data-skin=valley]:not([data-ranch]) body,html[data-theme][data-skin=valley]:not([data-ranch]) #boot{background-color:#7ec24a;background-image:linear-gradient(#8ec8ea 0 72px,#b7dc78 72px 140px,#7ec24a 140px);color:#3a2414}
  html[data-theme][data-skin=valley]:not([data-ranch]){--win:#fff1c4;--jt:#3a2414;--jdim:#6b4424}
  html[data-skin=valley] #boot>div:not(.cup){background:#f6e7c1;border:4px solid #6b3f1d;border-radius:6px;padding:6px 14px}
  html[data-skin=valley] #boot button{background:#e8a54a;color:#3a2414;border-color:#6b3f1d}
  html[data-theme=jrpg][data-xuan],html[data-theme=jrpg][data-xuan] body,html[data-theme=jrpg][data-xuan] #boot{background-color:#efe4cc;background-image:radial-gradient(ellipse at 50% -8%,rgba(255,236,206,.95),transparent 46%),linear-gradient(#f7f0df,#e7d7b8);color:#2a2018}
  html[data-xuan] #boot button{background:#3a2418;color:#f3e6c8;border-color:#c9a45a;border-radius:3px}
  html[data-theme=foundation],html[data-theme=foundation] body,html[data-theme=foundation] #boot{background:#e9d9b0;color:#3e2c1e}
  html.booted #boot{display:none}
  @keyframes bootb{to{transform:translateY(-6px)}}
</style>

<script>
(function(){

  setTimeout(function(){fail()},8000);
})();
</script>
