<style>
  html,body{background:#f7f4ec}

  #boot .err{display:none;max-width:320px;font-size:14px;color:#c94a6b}

  #boot button{margin-top:6px;border:2px solid #4a4a4a;border-radius:14px;background:#fbd6df;padding:8px 18px;font-size:15px}

  html[data-skin=valley],html[data-skin=valley] body,html[data-skin=valley] #boot{background:#5aa83c;color:#4a2c14}
