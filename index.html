<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Josefin+Sans:wght@600;700&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Josefin+Sans:wght@600;700&display=swap"></noscript>
<style>
  html,body{background:#f7f4ec}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:16px/1.5 -apple-system,"PingFang SC",sans-serif;color:#4a4a4a;background:#f7f4ec;z-index:9999;text-align:center;padding:24px}
  #boot .cup{font-size:44px;animation:bootb 1s ease-in-out infinite alternate}
  #boot .err{display:none;max-width:320px;font-size:14px;color:#c94a6b}
  #boot.failed .err{display:block}
  #boot button{margin-top:6px;border:2px solid #4a4a4a;border-radius:14px;background:#fbd6df;padding:8px 18px;font-size:15px}
  html[data-theme=jrpg],html[data-theme=jrpg] body,html[data-theme=jrpg] #boot{background:#0b0f2a;color:#fff}
  html[data-theme=jrpg] #boot button{background:#29366f;color:#fff;border-color:#fff;border-radius:4px}
  html.booted #boot{display:none}
  @keyframes bootb{to{transform:translateY(-6px)}}
</style>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="jrpg.css">
</head>
<body>
<div id="boot"><div class="cup">☕</div><div>墨尔本咖啡打卡 加载中…</div><div class="err" id="bootErr">加载有点慢或出错了，请检查网络后重试。</div><button id="bootRetry" style="display:none" onclick="location.reload()">重新加载</button></div>
<script>
(function(){
  function fail(msg){var b=document.getElementById('boot');if(!b||window.__appBooted)return;b.className='failed';var e=document.getElementById('bootErr');if(msg)e.textContent='加载出错：'+msg;document.getElementById('bootRetry').style.display='inline-block';}
  window.addEventListener('error',function(ev){if(!window.__appBooted&&ev&&ev.message)fail(ev.message)});
  setTimeout(function(){fail()},8000);
})();
</script>
<header id="topbar"><button id="backBtn" class="icon-btn hidden" aria-label="返回">‹</button><h1 id="title">墨尔本咖啡打卡</h1><span class="top-right" id="topRight"></span><div id="hud"></div></header>
<main id="app"></main>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="pickInput" accept="image/*" hidden>

  <a href="#/records" data-tab="records"><span class="ti">📒</span><span>记录</span></a>
  <a href="#/footprint" data-tab="footprint"><span class="ti">👣</span><span>足迹</span></a>
</nav>

<div id="toast"></div>
<div id="celebrate" class="hidden"></div>
